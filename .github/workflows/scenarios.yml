name: TUI scenarios

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tui-scenarios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[capture]' pytest
      - run: python -m pip install '.[gui]'
      - run: python tools/run_gui_screenshot.py
      - uses: actions/upload-artifact@v4
        with:
          name: gui-batch-screenshot
          path: artifacts/gui-batch.png
      - run: asciinema --version
      - run: python tools/validate_scenarios.py
      - run: python tools/run_scenarios.py
      - run: python tools/generate_scenario_docs.py
      - run: python tools/check_scenario_docs.py
      - name: Validate asciinema recordings
        run: |
          for recording in docs/recordings/*.cast; do
            asciinema play --out-fmt asciicast --speed 1000 "$recording" >/dev/null
          done
      - run: python -m pytest -q
      - name: Fail on stale generated artifacts
        run: |
          git diff --check
          git diff --exit-code -- artifacts docs/SCENARIOS.md docs/screenshots
          test -z "$(git ls-files --others --exclude-standard -- artifacts docs/SCENARIOS.md docs/screenshots)"
