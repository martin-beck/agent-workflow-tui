name: TUI scenarios

on:
  push:
  pull_request:

jobs:
  replay-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pytest
      - run: python tools/validate_scenarios.py
      - run: python tools/run_scenarios.py
      - run: python tools/generate_scenario_docs.py
      - run: python -m pytest -q
      - name: Fail on stale generated artifacts
        run: git diff --exit-code -- artifacts docs/SCENARIOS.md docs/screenshots
