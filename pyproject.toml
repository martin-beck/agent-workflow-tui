[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow-tui"
version = "0.1.0"
description = "Interactive human-in-the-loop terminal UI for Agent Workflow"
requires-python = ">=3.11"
dependencies = ["prompt-toolkit==3.0.51"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
